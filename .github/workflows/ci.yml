name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check autoflyer/ tests/
      - run: uv run ruff format --check autoflyer/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest tests/ -q --tb=short
      - name: Import smoke test
        run: |
          uv run python -c "from autoflyer.dashboard import app; print('dashboard ok')"
          uv run python -c "from autoflyer.garch_sizing import garch_position_fraction; print('garch ok')"
