<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoflyer bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
          background: #0f1117; color: #e2e8f0; padding: 16px; }
  h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; color: #f7fafc; }
  h2 { font-size: .8rem; color: #4a5568; font-weight: 500;
        text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 6px; }
  .card { background: #1a1d27; border-radius: 10px; padding: 14px 16px; }
  .card .label { font-size: .68rem; color: #718096; text-transform: uppercase;
                  letter-spacing: .05em; margin-bottom: 5px; }
  .card .value { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
  .card .sub   { font-size: .7rem; color: #718096; margin-top: 3px; }
  .pos  { color: #68d391; }
  .neg  { color: #fc8181; }
  .neu  { color: #e2e8f0; }
  .badge { display:inline-block; padding:3px 12px; border-radius:999px;
            font-size:.75rem; font-weight:700; }
  .badge.long { background:#276749; color:#9ae6b4; }
  .badge.flat { background:#2d3748; color:#a0aec0; }
  pre { background:#1a1d27; border-radius:10px; padding:14px;
         font-size:.7rem; line-height:1.6; overflow-x:auto;
         white-space:pre-wrap; word-break:break-all;
         max-height:380px; overflow-y:auto; color:#718096; }
  .ts  { font-size:.68rem; color:#4a5568; margin: 6px 0 14px; }
  .err { font-size:.7rem; color:#fc8181; margin-top:4px; }
  .btn { background:#2d3748; border:none; color:#a0aec0; padding:6px 14px;
          border-radius:6px; cursor:pointer; font-size:.8rem; }
  .btn:hover { background:#3d4a5c; }
  .chart-wrap { background:#1a1d27; border-radius:10px; padding:16px; margin-bottom:6px; }
  .badge.short { background:#742a2a; color:#feb2b2; }
  .banner { display:none; background:#742a2a; color:#fed7d7; border-radius:10px;
             padding:12px 16px; margin:10px 0; font-size:.85rem; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:#1a1d27; border-radius:10px;
          overflow:hidden; font-size:.75rem; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid #232838; white-space:nowrap; }
  th { color:#718096; font-weight:500; text-transform:uppercase; font-size:.65rem; }
  td:first-child, th:first-child { text-align:left; }
  .table-wrap { overflow-x:auto; max-height:360px; overflow-y:auto; border-radius:10px; }
  .muted { color:#4a5568; font-size:.7rem; margin-top:6px; }
</style>
</head>
<body>
<h1>autoflyer bot</h1>
<div class="ts" id="ts">最終更新: {{ now }}</div>
<button class="btn" onclick="load()">↻ 更新</button>

<div class="banner" id="halt-banner"></div>

<h2>ポジション</h2>
<div class="grid" id="pos-cards">読み込み中...</div>

<h2>現在価格 / 残高</h2>
<div class="grid" id="mkt-cards">読み込み中...</div>

<div class="err" id="err"></div>

<h2>資産推移</h2>
<div class="chart-wrap">
  <canvas id="equityChart" height="90"></canvas>
</div>

<h2>価格と売買ポイント <span id="tf-label"></span></h2>
<div class="chart-wrap">
  <canvas id="priceChart" height="90"></canvas>
</div>

<h2>取引履歴</h2>
<div class="table-wrap"><table id="trades"><tr><td>読み込み中...</td></tr></table></div>

<h2>バックテスト結果（Calmar 順）</h2>
<div class="table-wrap"><table id="backtest"><tr><td>読み込み中...</td></tr></table></div>
<div class="muted" id="backtest-meta"></div>

<h2>ログ</h2>
<pre id="logs">読み込み中...</pre>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
let equityChart = null;
let priceChart = null;

function esc(v) {
  return String(v ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shortLabel(iso) { return iso.slice(0, 16).replace('T', ' '); }

// 約定時刻を、その時刻を含むローソク足（直前のラベル）の位置に割り当てる
function markerPoints(labels, closes, trades, action) {
  const times = labels.map(l => Date.parse(l));
  const pts = [];
  for (const t of trades) {
    if (t.action !== action) continue;
    const ts = Date.parse(t.dt);
    let idx = -1;
    for (let i = 0; i < times.length && times[i] <= ts; i++) idx = i;
    if (idx < 0) continue;
    pts.push({ x: shortLabel(labels[idx]), y: t.price ?? closes[idx], trade: t });
  }
  return pts;
}

function initPriceChart(candles, trades, stopPx) {
  const labels = candles.labels;
  const ctx = document.getElementById('priceChart').getContext('2d');
  if (priceChart) priceChart.destroy();
  const datasets = [
    { type:'line', label:'終値', data: candles.close, borderColor:'#90cdf4',
      borderWidth:1.2, pointRadius:0, tension:0.1 },
    { type:'scatter', label:'エントリー', data: markerPoints(labels, candles.close, trades, 'entry'),
      pointStyle:'triangle', pointRadius:7, backgroundColor:'#68d391' },
    { type:'scatter', label:'決済', data: markerPoints(labels, candles.close, trades, 'exit'),
      pointStyle:'rectRot', pointRadius:6, backgroundColor:'#fc8181' },
  ];
  if (stopPx) {
    datasets.push({ type:'line', label:'ストップ', data: labels.map(() => stopPx),
      borderColor:'#f6ad55', borderDash:[4,4], borderWidth:1, pointRadius:0 });
  }
  priceChart = new Chart(ctx, {
    data: { labels: labels.map(shortLabel), datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color:'#718096', boxWidth:10 } },
        tooltip: { callbacks: { label: c => {
          const t = c.raw && c.raw.trade;
          if (t) return `${t.action} ${t.side} ${Number(t.btc).toFixed(4)} BTC @ ${fmt(t.price)} (${t.reason})`;
          return `${c.dataset.label}: ${fmt(c.parsed.y)} 円`;
        } } }
      },
      scales: {
        x: { ticks: { color:'#4a5568', maxTicksLimit:8 }, grid: { color:'#1e2535' } },
        y: { ticks: { color:'#4a5568', callback: v => (v/10000).toFixed(0)+'万' }, grid: { color:'#1e2535' } }
      }
    }
  });
}

function renderTrades(trades) {
  if (!trades.length) {
    document.getElementById('trades').innerHTML = '<tr><td>まだ取引はありません</td></tr>';
    return;
  }
  const rows = trades.slice().reverse().map(t => {
    const pnl = t.pnl == null ? '—'
      : `<span class="${t.pnl >= 0 ? 'pos' : 'neg'}">${t.pnl >= 0 ? '+' : ''}${fmt(t.pnl)}</span>`;
    return `<tr><td>${esc(new Date(t.dt).toLocaleString('ja-JP'))}</td><td>${esc(t.action)}</td>
      <td>${esc(t.side)}</td><td>${fmtBtc(t.btc)}</td><td>${fmt(t.price)}</td>
      <td>${esc(t.reason)}${t.dry_run ? ' (dry)' : ''}</td><td>${pnl}</td></tr>`;
  }).join('');
  document.getElementById('trades').innerHTML =
    '<tr><th>日時</th><th>種別</th><th>方向</th><th>BTC</th><th>価格</th><th>理由</th><th>損益</th></tr>' + rows;
}

function renderBacktest(bt) {
  const rows = (bt.rows || []).slice(0, 15);
  if (!rows.length) {
    document.getElementById('backtest').innerHTML =
      '<tr><td>結果がありません（python -m autoflyer backtest で生成）</td></tr>';
    return;
  }
  const num = (v, d=2) => v == null ? '—' : Number(v).toFixed(d);
  document.getElementById('backtest').innerHTML =
    '<tr><th>戦略</th><th>リターン%</th><th>CAGR%</th><th>最大DD%</th><th>Sharpe</th><th>Sortino</th><th>Calmar</th></tr>' +
    rows.map(r => `<tr><td>${esc(r.strategy)}</td><td>${num(r.total_return_pct,1)}</td>
      <td>${num(r.cagr_pct,1)}</td><td>${num(r.max_dd_pct,1)}</td><td>${num(r.sharpe)}</td>
      <td>${num(r.sortino)}</td><td>${num(r.calmar)}</td></tr>`).join('');
  document.getElementById('backtest-meta').textContent =
    `生成: ${new Date(bt.generated_at).toLocaleString('ja-JP')}  データ: ${bt.csv ?? '—'}  コスト: ${bt.costs ?? '—'}`;
}

function initChart(labels, values) {
  const ctx = document.getElementById('equityChart').getContext('2d');
  if (equityChart) equityChart.destroy();
  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '資産 (円)',
        data: values,
        borderColor: '#68d391',
        backgroundColor: 'rgba(104,211,145,0.08)',
        borderWidth: 1.5,
        pointRadius: 0,
        fill: true,
        tension: 0.2,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => Math.round(ctx.parsed.y).toLocaleString('ja-JP') + ' 円'
          }
        }
      },
      scales: {
        x: { ticks: { color:'#4a5568', maxTicksLimit:8 }, grid: { color:'#1e2535' } },
        y: {
          ticks: { color:'#4a5568', callback: v => (v/10000).toFixed(0)+'万' },
          grid: { color:'#1e2535' }
        }
      }
    }
  });
}

function fmt(n) {
  if (n == null) return '—';
  return Math.round(n).toLocaleString('ja-JP');
}
function fmtBtc(n) {
  if (n == null) return '—';
  return Number(n).toFixed(6);
}
function fmtPct(n) {
  if (n == null) return '';
  const cls = n >= 0 ? 'pos' : 'neg';
  const sign = n >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
}

async function load() {
  const [sr, tr, lr, eq, td, cd, bt] = await Promise.all([
    fetch('/api/state').then(r => r.json()),
    fetch('/api/ticker').then(r => r.json()),
    fetch('/api/logs').then(r => r.json()),
    fetch('/api/equity').then(r => r.json()),
    fetch('/api/trades').then(r => r.json()),
    fetch('/api/candles').then(r => r.json()),
    fetch('/api/backtest').then(r => r.json()),
  ]);

  const inPos = sr.in_pos;
  const side = (sr.side || 'long');
  const badge = inPos
    ? `<span class="badge ${side}">${side.toUpperCase()}</span>`
    : '<span class="badge flat">FLAT</span>';

  const banner = document.getElementById('halt-banner');
  banner.style.display = sr.halted ? 'block' : 'none';
  banner.textContent = sr.halted
    ? `⛔ Bot 停止中: ${sr.halt_reason ?? ''}（確認後 python -m autoflyer reset-halt で再開）`
    : '';

  const pnlCls = (tr.unrealized_pnl ?? 0) >= 0 ? 'pos' : 'neg';
  const pnlSign = (tr.unrealized_pnl ?? 0) >= 0 ? '+' : '';

  document.getElementById('pos-cards').innerHTML = `
    <div class="card">
      <div class="label">ポジション</div>
      <div class="value">${badge}</div>
      <div class="sub">${sr.entry_dt ? sr.entry_dt.slice(0,10) : '—'}</div>
    </div>
    <div class="card">
      <div class="label">エントリー価格</div>
      <div class="value neu">${fmt(sr.entry_price)} 円</div>
    </div>
    <div class="card">
      <div class="label">保有 BTC</div>
      <div class="value neu">${fmtBtc(sr.btc)}</div>
    </div>
    <div class="card">
      <div class="label">ストップ価格</div>
      <div class="value neg">${fmt(sr.stop_px)} 円</div>
      ${sr.entry_price && sr.stop_px
        ? `<div class="sub">エントリーから ${(((sr.stop_px - sr.entry_price) / sr.entry_price)*100).toFixed(1)}%</div>`
        : ''}
    </div>
    <div class="card">
      <div class="label">含み損益</div>
      <div class="value ${pnlCls}">${tr.unrealized_pnl != null ? pnlSign + fmt(tr.unrealized_pnl) + ' 円' : '—'}</div>
      <div class="sub">${fmtPct(tr.unrealized_pnl_pct)}</div>
    </div>
    <div class="card">
      <div class="label">ピーク資産</div>
      <div class="value pos">${fmt(sr.peak_cash)} 円</div>
    </div>
  `;

  const balanceCards = tr.is_cfd ? `
    <div class="card">
      <div class="label">証拠金</div>
      <div class="value neu">${fmt(tr.collateral)} 円</div>
      <div class="sub">評価損益 ${fmt(tr.open_position_pnl)} 円</div>
    </div>
    <div class="card">
      <div class="label">証拠金維持率</div>
      <div class="value neu">${tr.keep_rate == null ? '—' : (tr.keep_rate * 100).toFixed(0) + '%'}</div>
    </div>` : `
    <div class="card">
      <div class="label">JPY 残高</div>
      <div class="value neu">${fmt(tr.jpy_balance)} 円</div>
    </div>
    <div class="card">
      <div class="label">BTC 残高</div>
      <div class="value neu">${fmtBtc(tr.btc_balance)}</div>
    </div>`;
  document.getElementById('mkt-cards').innerHTML = `
    <div class="card">
      <div class="label">現在価格</div>
      <div class="value neu">${fmt(tr.last_price)} 円</div>
      <div class="sub">Bid ${fmt(tr.bid)} / Ask ${fmt(tr.ask)}</div>
    </div>` + balanceCards;

  if (cd.labels && cd.labels.length > 1) initPriceChart(cd, td.trades || [], inPos ? sr.stop_px : null);
  document.getElementById('tf-label').textContent = cd.timeframe ? `(${cd.timeframe})` : '';
  renderTrades(td.trades || []);
  renderBacktest(bt);

  if (eq.labels.length > 1) initChart(eq.labels, eq.values);
  document.getElementById('err').textContent = tr.error ? '⚠ ' + tr.error : '';
  document.getElementById('logs').textContent = lr.lines.slice().reverse().join('\n');
  document.getElementById('ts').textContent = '最終更新: ' + new Date().toLocaleString('ja-JP');
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
