[project]
name = "autoflyer"
version = "0.1.0"
description = "BitFlyer BTC自動売買ボット"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "requests>=2.32.5",
  "pyarrow>=22.0.0",
  "arch>=8.0.0",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.29",
]

[project.scripts]
autoflyer = "autoflyer.__main__:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["autoflyer*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length は formatter に任せる

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert OK in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
